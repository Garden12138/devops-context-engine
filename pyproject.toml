[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "devops-context-engine"
version = "2.0.0"
description = "ZenTao→GitLab→Portainer bug-fix loop tools for coding agents"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.16,<1", "httpx>=0.28,<1",
  "pydantic>=2.11,<3", "python-dotenv>=1.2,<2",
  "pyyaml>=6,<7", "ruamel.yaml>=0.18,<0.19",
  "beautifulsoup4>=4.13,<5", "mcp>=1.30,<2",
]

[project.scripts]
dce = "dce.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-beautifulsoup4"]

[tool.hatch.build.targets.wheel]
packages = ["src/dce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dce"]
mypy_path = "src"

[tool.coverage.run]
source = ["src/dce/workspace", "src/dce/loop", "src/dce/platforms"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
