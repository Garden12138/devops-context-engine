name: offline-contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev
      - run: uv run --offline ruff check .
      - run: uv run --offline mypy src
      - run: uv run --offline pytest -q --cov=src/dce --cov-report=term-missing
      - run: uv run --offline dce doctor --mock
      - run: uv run --offline python scripts/check_public_data.py
